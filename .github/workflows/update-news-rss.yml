name: Actualizar noticias desde el RSS de laubfal.com

# Nota: el trigger "schedule" de GitHub Actions solo corre sobre lo
# que este en la rama por defecto del repo (normalmente "main") — si
# este workflow vive solo en una rama de feature, no se dispara solo
# hasta que esa rama se mergee. Mientras tanto se puede probar a mano
# con "Run workflow" en la pestaña Actions (workflow_dispatch, abajo).
on:
  schedule:
    - cron: "*/30 * * * *" # cada 30 minutos
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-news-rss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Generar news/rss.json desde el feed
        run: python3 scripts/generate_news_from_rss.py

      - name: Commitear si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news/rss.json
          if git diff --cached --quiet; then
            echo "Sin cambios en las noticias del RSS."
          else
            git commit -m "Auto-actualizar noticias desde RSS"
            git push origin HEAD:${{ github.ref_name }}
          fi

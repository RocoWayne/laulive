<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laura Ubfal Live</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="bg-glow"></div>

  <!-- Marca de agua / branding -->
  <header class="brand">
    <div class="brand-dot"></div>
    <span class="brand-name">LAURA UBFAL</span>
    <span class="brand-sep">•</span>
    <span class="brand-live">EN VIVO 24/7</span>
  </header>

  <div class="clock" id="clock">--:--</div>

  <!-- Reproductor / Now Playing -->
  <section class="player" id="player">
    <div class="eq" id="eq" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="player-info">
      <div class="player-label">SONANDO AHORA</div>
      <div class="player-title" id="trackTitle">Cargando playlist…</div>
      <div class="player-artist" id="trackArtist">&nbsp;</div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
  </section>

  <!-- Overlay de noticias -->
  <aside class="news" id="newsCard">
    <div class="news-media">
      <img id="newsImage" src="" alt="">
    </div>
    <div class="news-body">
      <div class="news-tag">NOTICIA</div>
      <div class="news-text" id="newsText"></div>
      <div class="news-qr-row">
        <img id="newsQr" class="news-qr" src="" alt="Código QR">
        <span class="news-qr-label">Escaneá para<br>leer la nota</span>
      </div>
    </div>
  </aside>

  <audio id="audio" preload="auto"></audio>

  <div class="autoplay-gate" id="autoplayGate">
    <div class="autoplay-box">
      <p>Click para iniciar la transmisión de audio</p>
      <button id="autoplayBtn">▶ Iniciar</button>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laura Ubfal Live</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Fondo rotativo de publicidades (imagenes y video sin sonido) -->
  <div class="bg-media" id="bgMedia">
    <img id="bgImage" class="bg-layer" alt="">
    <video id="bgVideo" class="bg-layer" muted playsinline preload="auto"></video>
  </div>

  <div class="bg-glow"></div>

  <!-- Marca de agua / branding -->
  <header class="brand">
    <div class="brand-dot"></div>
    <span class="brand-name">LAURA UBFAL</span>
    <span class="brand-sep">•</span>
    <span class="brand-live">EN VIVO 24/7</span>
  </header>

  <div class="clock" id="clock">--:--</div>

  <!-- Reproductor / Now Playing -->
  <section class="player" id="player">
    <div class="eq" id="eq" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="player-info">
      <div class="player-label">SONANDO AHORA</div>
      <div class="player-title" id="trackTitle">Cargando playlist…</div>
      <div class="player-artist" id="trackArtist">&nbsp;</div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
  </section>

  <!-- Pantalla de noticias: reemplaza el fondo de publicidades cuando
       esta activa (fondo de color plano, pensada para verse bien en
       un TV). Titulo + imagen + QR grande para escanear. -->
  <section class="news-screen" id="newsScreen">
    <div class="news-tag">NOTICIA</div>
    <img id="newsImage" class="news-image" src="" alt="">
    <div class="news-text" id="newsText"></div>
    <div class="news-qr-row">
      <img id="newsQr" class="news-qr" src="" alt="Código QR">
      <span class="news-qr-label">Escaneá el código<br>para leer la nota completa</span>
    </div>
  </section>

  <audio id="audio" preload="auto"></audio>

  <div class="autoplay-gate" id="autoplayGate">
    <div class="autoplay-box">
      <p>Click para iniciar la transmisión de audio</p>
      <button id="autoplayBtn">▶ Iniciar</button>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>

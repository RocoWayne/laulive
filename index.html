<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laura Ubfal Live</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Fondo rotativo de publicidades (imagenes y video sin sonido).
       Dos capas alternadas para poder hacer un crossfade real entre
       un fondo y el siguiente (sea imagen o video). -->
  <div class="bg-media" id="bgMedia">
    <div class="bg-layer" id="bgLayerA">
      <img class="bg-layer-img" alt="">
      <video class="bg-layer-video" muted playsinline preload="auto"></video>
    </div>
    <div class="bg-layer" id="bgLayerB">
      <img class="bg-layer-img" alt="">
      <video class="bg-layer-video" muted playsinline preload="auto"></video>
    </div>
  </div>

  <div class="bg-glow"></div>

  <!-- Marca de agua / branding -->
  <header class="brand">
    <div class="brand-dot"></div>
    <span class="brand-name">LAURA UBFAL</span>
    <span class="brand-sep">•</span>
    <span class="brand-live">EN VIVO 24/7</span>
  </header>

  <div class="clock" id="clock">--:--</div>

  <!-- Reproductor / Now Playing -->
  <section class="player" id="player">
    <div class="eq" id="eq" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="player-info">
      <div class="player-label">SONANDO AHORA</div>
      <div class="player-title" id="trackTitle">Cargando playlist…</div>
      <div class="player-artist" id="trackArtist">&nbsp;</div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
  </section>

  <!-- Pantalla de noticias: reemplaza el fondo de publicidades cuando
       esta activa (fondo de color plano, pensada para verse bien en
       un TV). Titulo + imagen + QR grande para escanear. -->
  <section class="news-screen" id="newsScreen">
    <div class="news-tag">NOTICIA</div>
    <img id="newsImage" class="news-image" src="" alt="">
    <div class="news-text" id="newsText"></div>
    <div class="news-qr-row">
      <img id="newsQr" class="news-qr" src="" alt="Código QR">
      <span class="news-qr-label">Escaneá el código<br>para leer la nota completa</span>
    </div>
  </section>

  <!-- Popup de suscripción: desciende desde arriba al centro cada
       tanto, invitando a suscribirse. -->
  <div class="subscribe-popup" id="subscribePopup">
    <svg class="subscribe-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5S10.5 3.17 10.5 4v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z" fill="currentColor"/>
    </svg>
    <div class="subscribe-text">
      <div class="subscribe-title">¡Suscribite!</div>
      <div class="subscribe-sub">No te pierdas ninguna noticia del espectáculo</div>
    </div>
  </div>

  <audio id="audio" preload="auto"></audio>

  <div class="autoplay-gate" id="autoplayGate">
    <div class="autoplay-box">
      <p>Click para iniciar la transmisión de audio</p>
      <button id="autoplayBtn">▶ Iniciar</button>
    </div>
  </div>

  <script src="js/impressions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
